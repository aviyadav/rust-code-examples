[package]
name = "delta-import-export"
version = "0.1.0"
edition = "2024"
default-run = "delta-import-export"

[dependencies]
arrow = "60.0.0"
arrow-csv = "60.0.0"
clap = { version = "4.6.7", features = ["derive"] }
delta_kernel = "0.30.0"
delta_kernel_default_engine = { version = "0.30.0", features = ["rustls"] }
parquet = { version = "60.0.0", features = ["arrow"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
