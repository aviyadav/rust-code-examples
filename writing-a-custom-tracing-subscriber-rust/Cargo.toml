[package]
name = "custom-tracing-subscriber"
version = "0.1.0"
edition = "2024"
description = "A custom tracing subscriber with filtering, text/JSON output, and span tracking"
license = "MIT"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
