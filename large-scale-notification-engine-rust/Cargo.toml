[workspace]
resolver = "2"
members = ["crates/common", "crates/engine", "crates/provider", "crates/generator"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
# cmake-build compiles librdkafka from source: only cmake + a C compiler are needed.
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "curl-static", "tokio"] }
# Runtime queries only (no query! macros) => no DATABASE_URL needed at compile time.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
redis = { version = "=0.25.4", default-features = false, features = ["tokio-comp", "connection-manager"] }
governor = "=0.6.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"

[profile.release]
lto = "thin"